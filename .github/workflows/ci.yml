name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libcups2-dev python3
      - name: Build and test (-Werror)
        run: make CFLAGS="-O2 -g -Werror" check
      - name: Sanitizer run
        run: |
          make clean
          make CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Werror" \
               LDFLAGS="-fsanitize=address,undefined" check
          make clean
      - name: Build .deb
        run: make deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.os }}
          path: build/*.deb

  raspberry-pi-armhf:
    # Debian bookworm armhf == Raspberry Pi OS 32-bit userland, run under QEMU.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm
      - name: Build, test and package in a bookworm/armhf container
        run: |
          docker run --rm --platform linux/arm/v7 -v "$PWD:/src" -w /src debian:bookworm bash -ec '
            apt-get update -qq
            apt-get install -y -qq build-essential libcups2-dev python3 file >/dev/null
            make CFLAGS="-O2 -Werror" check
            make deb
            file build/sp410-rastertotspl'
      - uses: actions/upload-artifact@v4
        with:
          name: deb-armhf
          path: build/*.deb

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y shellcheck
      - run: shellcheck scripts/*.sh packaging/*.sh tools/re/*.sh
      - run: python3 -m py_compile tools/*.py tools/re/*.py tests/*.py ppd/gen_ppd.py
      - run: python3 ppd/gen_ppd.py --check
